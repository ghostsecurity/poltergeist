rules:
  - name: CircleCI PAT
    id: ghost.circleci.1
    description: CircleCI PAT
    tags:
      - api
      - circleci
      - pat
    pattern: |
      (?x)
        \b
          (CCIPAT_(?i)[A-Z0-9]{22}_[A-F0-9]{40})
        \b
    entropy: 4.4
    redact: [6, 4]
    tests:
      assert:
        - CCIPAT_3n3hiH9XTrcFi8ztrwLUP5_6ec5b228b13e567e7d98445834ba5496130be081
        - CCIPAT_Tf1Qy7dMTJyjsYfoBUDjWy_9494abba72ec6ad80fd97a59e5c81ba52bbee5f9
        - CCIPAT_Bct7QCs6AZhCeAhUNvHCuJ_b5a32715ae4d914317ef13f503ce68632135068f
      assert_not:
        - CCXPAT_Bct7QCs6AZhCeAhUNvHCuJ_b5a32715ae4d914317ef13f503ce68632135068f
        - CCIPAT_Bct7QCs6AZhCeAhUNvHCuJ_b5a32715ae4d914317ef13f503ce68632135068
        - CCIPAT_Bct7QCs6AZhCeAhUNvHCu_b5a32715ae4d914317ef13f503ce68632135068f
    history:
      - 2026-03-16 initial version
    refs:
      - https://circleci.com/docs/guides/toolkit/managing-api-tokens/
