rules:
  - name: PostHog Project Token
    id: ghost.posthog.1
    description: PostHog Project Token
    tags:
      - api
      - posthog
      - project
    pattern: |
      (?x)
        \b
          (phc_(?i)[A-Z0-9]{43})
        \b
    entropy: 4.5
    redact: [7, 4]
    tests:
      assert:
        - phc_aqfHRbb8Qtie27AVUo4E1TrVzEseao6YHbdIVy3CiKo
        - phc_Bp2iHmuhMYusjr0ypu9tL7ofj72CcI2jVghD7i38MTl
